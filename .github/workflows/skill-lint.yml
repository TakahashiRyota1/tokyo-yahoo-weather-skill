name: Skill Lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/skill-lint.yml'
      - '.github/scripts/lint_skills.py'
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint skills (SKILL.md structure / frontmatter / AIP env constraints)
        run: python3 .github/scripts/lint_skills.py
